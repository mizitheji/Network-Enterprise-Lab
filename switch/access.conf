! =========================================================
! ACCESS Switch Configuration – Cisco Catalyst 9300L
! =========================================================
! Device Role:
!   - Access Layer Switch
!   - User & Wireless Edge Connectivity
!
! Connected Devices:
!   - Core Switch (C9300)
!   - Juniper AP12 (Wireless Access Point)
! =========================================================


! ---------------------------------------------------------
! System Identity & Device Security
! Purpose:
!   - Set hostname
!   - Configure local authentication
! ---------------------------------------------------------
hostname ACCESS_SW
!
enable secret <your enable secret password>
!
username <your username> secret <your secret password>

! ---------------------------------------------------------
! Global Routing Configuration
! Purpose:
!   - Enable IP routing for management reachability
! ---------------------------------------------------------
ip routing

! ---------------------------------------------------------
! VLAN Definition
! Purpose:
!   - Define access and wireless VLANs
! ---------------------------------------------------------
vlan 10
 name STAFF
!
vlan 20
 name GUEST
!
vlan 30
 name WIRELESS

! ---------------------------------------------------------
! Access Ports – Staff Network (VLAN 10)
! Purpose:
!   - Connect wired staff endpoints
! ---------------------------------------------------------
interface range GigabitEthernet1/0/1 - 12
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast

! ---------------------------------------------------------
! Trunk Port – Wireless Access Point (Juniper AP12)
! Purpose:
!   - Carry Guest and Enterprise wireless VLANs
! ---------------------------------------------------------
interface GigabitEthernet1/0/13
 description TO AP12
 switchport mode trunk
 spanning-tree portfast trunk

! ---------------------------------------------------------
! Trunk Port – Uplink to Core Switch
! Purpose:
!   - Extend VLANs to the core layer
! ---------------------------------------------------------
interface GigabitEthernet1/0/24
 description TO CORE
 switchport mode trunk
 spanning-tree portfast trunk

! ---------------------------------------------------------
! Management SVI – VLAN 1
! Purpose:
!   - Switch management and monitoring access
! ---------------------------------------------------------
interface Vlan1
 description MGMT
 ip address 172.20.1.3 255.255.255.0

! ---------------------------------------------------------
! Default Route Configuration
! Purpose:
!   - Forward management traffic to Core Switch
! ---------------------------------------------------------
ip route 0.0.0.0 0.0.0.0 172.20.1.2

! ---------------------------------------------------------
! SNMP Configuration
! Purpose:
!   - Enable network monitoring
! ---------------------------------------------------------
snmp-server community <your community string> RO

! ---------------------------------------------------------
! Remote Management Access
! Purpose:
!   - Secure SSH access
! ---------------------------------------------------------
line vty 0 4
 login local
 transport input ssh
!
