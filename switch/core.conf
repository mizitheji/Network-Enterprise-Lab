! =========================================================
! CORE Switch Configuration – Cisco Catalyst 9300
! =========================================================
! Device Role:
!   - Core Layer-3 Switch
!   - Inter-VLAN Routing
!   - DHCP Server (Wired & Wireless)
!
! Connected Devices:
!   - MikroTik (Internet, Hotspot, RADIUS)
!   - Access Switch (C9300L)
!   - Proxmox Server
! =========================================================


! ---------------------------------------------------------
! System Identity & Global Routing
! Purpose:
!   - Set device hostname
!   - Enable Layer-3 routing
! ---------------------------------------------------------
hostname CORE
!
ip routing

! ---------------------------------------------------------
! DNS Configuration
! Purpose:
!   - Define DNS resolvers for the switch
! ---------------------------------------------------------
ip name-server 192.168.40.100

! ---------------------------------------------------------
! DHCP Server – Wired Users (VLAN 10)
! Purpose:
!   - Assign IP addresses to wired clients
! ---------------------------------------------------------
ip dhcp pool V10_WIRED
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1 
 dns-server 192.168.40.100 
 lease 0 8

! ---------------------------------------------------------
! DHCP Server – Wireless Users (VLAN 30)
! Purpose:
!   - Assign IP addresses to enterprise wireless clients
! ---------------------------------------------------------
ip dhcp pool V30_WIRELESS
 network 172.30.30.0 255.255.255.0
 default-router 172.30.30.1 
 dns-server 192.168.40.100 
 lease 0 8

! ---------------------------------------------------------
! Local User Authentication
! Purpose:
!   - Secure device access
! ---------------------------------------------------------
enable secret <your enable secrect password>
!
username <your username> secret <your secrect password>

! ---------------------------------------------------------
! VLAN Configuration
! Purpose:
!   - Define Layer-2 VLANs used across the network
! ---------------------------------------------------------
vlan 10
 name STAFF
!
vlan 20
 name GUEST
!
vlan 30
 name WIRELESS
!
vlan 40
 name SERVER

! ---------------------------------------------------------
! Interface configuration
! ---------------------------------------------------------
interface GigabitEthernet1/0/1
 description To MK (P4) (GUEST)
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast
!
interface GigabitEthernet1/0/14
 description To PROXMOX
 switchport mode trunk
 spanning-tree portfast trunk
!
interface GigabitEthernet1/0/23
 description To MK (P5) (Vlan Routed)
 switchport mode access
 spanning-tree portfast
!
interface GigabitEthernet1/0/24
 description To ACCESS_SW
 switchport mode trunk
 spanning-tree portfast trunk

! ---------------------------------------------------------
! SVI – Management Network (VLAN 1)
! Purpose:
!   - Switch management and control plane access
! ---------------------------------------------------------
interface Vlan1
 description MGMT
 ip address 172.20.1.2 255.255.255.0

! ---------------------------------------------------------
! SVI – Wired Users (VLAN 10)
! Purpose:
!   - Default gateway for wired clients
! ---------------------------------------------------------
interface Vlan10
 description WIRED_USER
 ip address 192.168.10.1 255.255.255.0

! ---------------------------------------------------------
! SVI – Wireless Users (VLAN 30)
! Purpose:
!   - Default gateway for enterprise WiFi clients
! ---------------------------------------------------------
interface Vlan30
 description WIRELESS_USER
 ip address 172.30.30.1 255.255.255.0

! ---------------------------------------------------------
! SVI – Server Network (VLAN 40)
! Purpose:
!   - Default gateway for servers and services
! ---------------------------------------------------------
interface Vlan40
 description SERVER
 ip address 192.168.40.1 255.255.255.0

! ---------------------------------------------------------
! Static Routing
! Purpose:
!   - Forward internet-bound traffic to MikroTik
! ---------------------------------------------------------
ip route 0.0.0.0 0.0.0.0 172.20.1.1 name DEFAULT_ROUTE

! ---------------------------------------------------------
! SNMP Configuration
! Purpose:
!   - Enable monitoring and network observability
! ---------------------------------------------------------
snmp-server community <your community string> RO

! ---------------------------------------------------------
! Remote Management Access
! Purpose:
!   - Secure remote SSH access
! ---------------------------------------------------------
line vty 0 4
 login local
 transport input ssh
!
