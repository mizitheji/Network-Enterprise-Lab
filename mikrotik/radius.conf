# =========================================================
# MikroTik Local RADIUS (User Manager) Configuration
# =========================================================
# Purpose:
#   - Provide WPA2/WPA3-Enterprise authentication
#   - Act as local RADIUS server using User Manager
#   - Authenticate wireless clients via Juniper AP12
#
# RADIUS Flow:
#   Client → AP (Juniper AP12) → MikroTik User Manager → Accept / Reject
# =========================================================

# ---------------------------------------------------------
# AAA Configuration
# Purpose:
#   - Enable RADIUS for USER
# ---------------------------------------------------------
/user aaa
set use-radius=yes

# ---------------------------------------------------------
# User Manager (RADIUS Server) Configuration
# Purpose:
#   - Enable MikroTik User Manager
#   - Bind certificate for EAP authentication
# ---------------------------------------------------------
/user-manager
set certificate=lab-cert enabled=yes

# ---------------------------------------------------------
# RADIUS Clients
# Purpose:
#   - Define devices allowed to send RADIUS requests
#   - Juniper AP12 (Wireless Authentication)
#   - Local RADIUS loopback
# ---------------------------------------------------------
/user-manager router
add address=172.20.1.10 name="Juniper AP12"
add address=127.0.0.1 name="RADIUS LOCAL"

# ---------------------------------------------------------
# RADIUS Users
# Purpose:
#   - Define wireless users for WPA2-Enterprise
# ---------------------------------------------------------
/user-manager user
add name=intuser1 password=test123 shared-users=5

# ---------------------------------------------------------
# RADIUS EAP Authentication Methods
# Purpose:
#   - Define supported EAP methods for Enterprise WiFi
# ---------------------------------------------------------
/user-manager user group
set [ find default-name=default ] outer-auths=\
    eap-tls,eap-ttls,eap-peap,eap-mschap2

# ---------------------------------------------------------
# RADIUS Service Configuration
# Purpose:
#   - Enable RADIUS for Wireless and 802.1X authentication
# ---------------------------------------------------------
/radius
add address=127.0.0.1 service=wireless,dot1x

# ---------------------------------------------------------
# RADIUS Incoming Requests
# Purpose:
#   - Allow incoming authentication requests
# ---------------------------------------------------------
/radius incoming
set accept=yes
