# =========================================================
# MikroTik Network Configuration
# =========================================================
# Device Role:
#   - Internet Edge Router
#   - Firewall & NAT Gateway
#   - RADIUS (User Manager)
#   - Guest Hotspot Controller
#
# Connected To:
#   - ISP (WAN)
#   - Cisco C9300 Core (LAN / Transit)
#
# =========================================================

# ---------------------------------------------------------
# Interface Configuration
# Purpose:
#   - Define WAN (ISP-facing)
#   - Define LAN (Core-facing / Management)
# ---------------------------------------------------------
/interface ethernet
set [ find default-name=ether5 ] name=LAN
set [ find default-name=ether2 ] name=WAN

# ---------------------------------------------------------
# IP Addressing
# Purpose:
#   - WAN /30 transit network
#   - Management LAN subnet
# ---------------------------------------------------------
/ip address
add address=10.255.255.2/30 comment=INTERNET interface=WAN network=10.255.255.0
add address=172.20.1.1/24 comment=LAN interface=LAN network=172.20.1.0

# ---------------------------------------------------------
# Routing Configuration
# Purpose:
#   - Default route to ISP
#   - Static routes to internal VLANs via C9300
# ---------------------------------------------------------
/ip route
add comment="DEFAULT ROUTE" disabled=no distance=1 dst-address=0.0.0.0/0 \
    gateway=10.255.255.1 routing-table=main scope=30 suppress-hw-offload=no \
    target-scope=10
add comment=STAFF disabled=no distance=1 dst-address=192.168.10.0/24 gateway=\
    172.20.1.2 routing-table=main scope=30 suppress-hw-offload=no \
    target-scope=10
add comment=WIRELESS disabled=no distance=1 dst-address=172.30.30.0/24 \
    gateway=172.20.1.2 routing-table=main scope=30 suppress-hw-offload=no \
    target-scope=10
add comment=SERVER disabled=no distance=1 dst-address=192.168.40.0/24 \
    gateway=172.20.1.2 routing-table=main scope=30 suppress-hw-offload=no \
    target-scope=10

# ---------------------------------------------------------
# Firewall NAT – Hotspot / Guest Source NAT
# Purpose:
#   - Translate private IPs to WAN interface IP
# ---------------------------------------------------------
/ip firewall nat
add action=passthrough chain=unused-hs-chain add action=masquerade chain=srcnat

# ---------------------------------------------------------
# DNS Configuration
# Purpose:
#   - Configure upstream DNS resolvers
#   - Support internal name resolution
# ---------------------------------------------------------
/ip dns
set servers=8.8.8.8,1.1.1.1,192.168.40.100

# ---------------------------------------------------------
# SNMP Configuration
# Purpose:
#   - Enable SNMP for monitoring
#   - Define community access
# ---------------------------------------------------------
/snmp community
add addresses=::/0 name=<your community string> write-access=yes

# ---------------------------------------------------------
# SNMP Trap Settings
# Purpose:
#   - Send traps to monitoring server
# ---------------------------------------------------------
/snmp
set enabled=yes trap-community=<your community string> trap-target=192.168.40.101 trap-version=2
