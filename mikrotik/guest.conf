# =========================================================
# Guest Network – MikroTik Hotspot Configuration
# =========================================================
# Purpose:
#   - Provide captive portal (splash page) for Guest users
#   - Enforce network isolation
#   - Allow internet access after authentication
#
# Guest Network:
#   - VLAN 20
#   - Subnet: 192.168.20.0/24
# =========================================================

# ---------------------------------------------------------
# Guest Bridge Configuration
# Purpose:
#   - Create logical Layer 2 domain for Guest access
#   - Bind Guest-facing interface to hotspot
# ---------------------------------------------------------
/interface bridge
add name=GUEST-BRIDGE

# ---------------------------------------------------------
# Bridge Port Assignment
# Purpose:
#   - Attach physical interface to Guest bridge
# ---------------------------------------------------------
/interface bridge port
add bridge=GUEST-BRIDGE interface=ether4

# ---------------------------------------------------------
# Hotspot Profile Configuration
# Purpose:
#   - Define captive portal parameters
#   - Set hotspot IP, DNS name, and authentication methods
# ---------------------------------------------------------
/ip hotspot profile
add name=guest-hotspot
add hotspot-address=192.168.20.10 name=hsprof1
add dns-name=guest.wifi.local name=hsprof2
add login-by=http-chap,http-pap name=hsprof3
add name=hsprof4

# ---------------------------------------------------------
# Hotspot Server Configuration
# Purpose:
#   - Enable hotspot service on Guest bridge
#   - Bind hotspot profile to interface
# ---------------------------------------------------------
/ip hotspot
add disabled=no interface=GUEST-BRIDGE name=guest-hotspot profile=guest-hotspot

# ---------------------------------------------------------
# Guest User Accounts
# Purpose:
#   - Define local hotspot users
#   - Used for splash page login / testing
# ---------------------------------------------------------
/ip hotspot user
add name=guest1 password=Test123 profile=guest-profile
add name=guest2 password=Test123 profile=guest-profile

# ---------------------------------------------------------
# Hotspot Walled Garden
# Purpose:
#   - Allow limited access before authentication
#   - Required for captive portal redirection
# ---------------------------------------------------------
/ip hotspot walled-garden
add dst-host=*.google.com
add dst-host=*.cloudflare.com

# ---------------------------------------------------------
# Guest User Profile
# Purpose:
#   - Enforce bandwidth limits
#   - Control session and idle timeout
# ---------------------------------------------------------
/ip hotspot user profile
add idle-timeout=15m name=guest-profile rate-limit=5M/5M session-timeout=2h

# ---------------------------------------------------------
# DHCP Network Configuration
# Purpose:
#   - Define default gateway and DNS for Guest clients
# ---------------------------------------------------------
/ip dhcp-server network
add address=192.168.20.0/24 dns-server=192.168.40.100 gateway=192.168.20.10

# ---------------------------------------------------------
# DHCP Address Pool
# Purpose:
#   - Allocate IP addresses to Guest devices
# ---------------------------------------------------------
/ip pool
add name=dhcp_pool0 ranges=192.168.20.50-192.168.20.100

# ---------------------------------------------------------
# DHCP Server Configuration
# Purpose:
#   - Provide automatic IP addressing for Guest clients
# ---------------------------------------------------------
/ip dhcp-server
add address-pool=dhcp_pool0 interface=GUEST-BRIDGE name=dhcp1

# ---------------------------------------------------------
# Firewall Rules – Guest Network Isolation
# Purpose:
#   - Block Guest access to internal VLANs
#   - Enforce security boundaries
# ---------------------------------------------------------
/ip firewall filter
add action=drop chain=forward comment="Block Guest to VLAN 30" dst-address=\
    172.30.30.0/24 src-address=192.168.20.0/24
add action=drop chain=forward comment="Block Guest to VLAN 10" dst-address=\
    192.168.10.0/24 src-address=192.168.20.0/24
add action=drop chain=forward comment="Block Guest to VLAN 40" dst-address=\
    192.168.40.0/24 src-address=192.168.20.0/24
add action=drop chain=forward comment="Block Guest to VLAN 1" dst-address=\
    172.20.1.0/24 src-address=192.168.20.0/24
# --- Block Guest to Internal Networks ---

# ---------------------------------------------------------
# Firewall Rules – Guest Internet Access
# Purpose:
#   - Allow Guest traffic to the internet after authentication
# ---------------------------------------------------------
add action=accept chain=forward comment="Allow Guest to Internet" \
    src-address=192.168.20.0/24
